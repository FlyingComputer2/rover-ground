# winject-radio-realtek on the GS (Orange Pi 5). Pairs with winject-manager/config.cfg.
# RTL8812AU bench dongle wlx00c0cabce06f, driver rtl88xxau_wfb (not stock 88XXau).

radio.device     = wlx00c0cabce06f
radio.driver     = rtl88xxau_wfb
radio.regdom     = BO
radio.bandwidth  = 20
radio.txpower    = txpower.csv

net.bind         = 127.0.0.1
net.console_port = 2201
net.dplane_port  = 9000

state.dir        = /var/lib/winject-radio-realtek

tune.tx_queue_sz = 20
log.level        = info
