# Ground station winject-manager for the rover link.
# Upstreams (GS): id 0 WireGuard, id 1 video RTP + reverse telemetry.
# The rover mirrors these with tx_bus/rx_bus swapped and server bind addresses.

winject.device        = 127.0.0.1
winject.console       = 2201
winject.dplane_port   = 9000
winject.radio_fcs     = actual
winject.channel       = 13
# Bench (dongles close together): 36M + 2 dBm. 20 dBm overloads RX at short range; restore 20 in the field.
winject.modulation    = OFDM_36M
winject.power         = 2
winject.domain        = 0xB00B
winject.max_rate_kbps = 80000
winject.stats_sec     = 1
manager.console_in    = 192.168.128.1:2424

upstream.size = 2

upstream-0.mode             = UDP_CLIENT_FORWARDING
upstream-0.fec.type         = RS_BLOCK_ERASURE
upstream-0.fec.k            = 1
upstream-0.fec.n            = 3
upstream-0.tx_bus           = a1
upstream-0.rx_bus           = b2
upstream-0.scheduler_budget = 4096
upstream-0.connect_address  = 127.0.0.1:51820

# Manager FEC off: stream_sender adapts FEC from receiver telemetry end to end.
upstream-1.mode             = UDP_CLIENT_FORWARDING
upstream-1.fec.type         = NONE
upstream-1.tx_bus           = d4
upstream-1.rx_bus           = c3
upstream-1.scheduler_budget = 4096
upstream-1.connect_address  = 127.0.0.1:21082
